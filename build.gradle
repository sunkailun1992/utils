// 使用 java-library 插件，把当前项目构建为可被其他项目依赖的公共 Java jar。
plugins {
    // java-library 提供 api / implementation 依赖隔离能力，适合公共工具包。
    id 'java-library'
    // maven-publish 用于把 utils 发布到 Maven Local 或远程 Maven 仓库。
    id 'maven-publish'
    // Spring 依赖管理插件用于导入 Spring Boot、Spring Cloud、Spring Cloud Alibaba BOM。
    id 'io.spring.dependency-management' version '1.1.7'
}

// 设置统一公共 Maven groupId，消费者必须使用同一坐标拉取制品。
group = 'com.kellen'

// 设置 Maven version，必须保持与消费者项目依赖版本一致。
version = '1.4.8'

// 设置项目描述，便于发布后的元数据识别。
description = 'utils'

// 私有 Maven 仓库是可选能力，只能通过本机 Gradle 属性或环境变量注入。
def privateMavenUrl = providers.gradleProperty('privateMavenUrl')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_URL'))
def privateMavenUsername = providers.gradleProperty('privateMavenUsername')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_USERNAME'))
def privateMavenPassword = providers.gradleProperty('privateMavenPassword')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_PASSWORD'))

// 定义依赖版本，集中管理避免依赖声明里散落魔法版本。
ext {
    // Java 源码和字节码版本。
    javaReleaseVersion = 17
    // Spring Boot 版本，对齐当前微服务统一 Boot 4 运行时。
    springBootVersion = '4.0.4'
    // Spring Cloud 版本，用于 Cloud 生态组件版本管理。
    springCloudVersion = '2025.1.1'
    // Spring Cloud Alibaba 版本，用于 Nacos、Seata Alibaba 适配组件版本管理。
    springCloudAlibabaVersion = '2025.1.0.0'
    // Nacos Client 版本，显式对齐当前 Nacos 3.2.2 服务端。
    nacosClientVersion = '3.2.2'
    // Dubbo 版本，当前 3.3.x 稳定线提供 Triple 协议、Nacos 注册和 Spring Boot starter。
    dubboVersion = '3.3.6'
    // MyBatis-Plus 版本，用于 ORM、分页、租户、乐观锁插件。
    mybatisPlusVersion = '3.5.16'
    // Springdoc OpenAPI 版本，用于保留标准 /v3/api-docs 能力。
    springdocVersion = '3.0.3'
    // Hutool 版本，用于常用 Java 工具能力。
    hutoolVersion = '5.8.46'
    // MyBatis Mate 版本，用于 MyBatis-Plus 企业增强能力。
    mybatisMateVersion = '1.3.6'
    // Lombok 版本，用于编译期生成 getter、setter、日志对象等代码。
    lombokVersion = '1.18.46'
    // Druid 版本，用于数据库连接池和监控能力。
    druidVersion = '1.2.28'
    // Dynamic Datasource 版本，用于主库、灰度库等数据源切换能力。
    dynamicDatasourceVersion = '4.5.0'
    // 阿里云 OSS SDK 版本，用于对象存储上传、下载和签名能力。
    aliyunOssVersion = '3.18.5'
    // 阿里云 Java Core SDK 版本，用于短信、STS、函数工作流等基础客户端能力。
    aliyunCoreVersion = '4.7.8'
    // Redisson 版本，4.x 适配 Spring Boot 4 自动配置包名。
    redissonVersion = '4.6.1'
    // JJWT 版本，当前代码使用 0.9.x API，暂不跨到 0.12+ 新 API。
    jjwtVersion = '0.9.1'
    // OkHttp 版本，5.x 稳定线；RequestBody.create 参数顺序调整为 (content, MediaType)。
    okhttpVersion = '5.0.0'
    // Guava 版本，用于集合辅助和不可变集合能力。
    guavaVersion = '33.6.0-jre'
    // Apache Commons Collections 版本，用于集合工具能力。
    commonsCollectionsVersion = '4.5.0'
    // Apache POI 版本，用于 Hutool Excel 运行时和 Office 文档处理。
    poiVersion = '5.5.1'
    // iText 7 版本，PdfUtils 改用 kernel/io/layout/forms 新 API。
    itextVersion = '7.2.5'
    // iText font-asian 版本，替代 iText 5 的 itext-asian，提供 STSong-Light 等 CJK 字体 CMap。
    fontAsianVersion = '7.2.5'
    // PDFBox 版本，3.x 线；加载入口由 PDDocument.load 改为 Loader.loadPDF。
    pdfboxVersion = '3.0.5'
    // Dozer 版本，用于通用对象属性映射能力。
    dozerVersion = '6.5.2'
    // Seata 客户端版本，用于分布式事务代理和 XID 透传；当前已发布 starter 最新为 2.6.0，可注册到 Seata Server 2.7.0。
    seataVersion = '2.6.0'
    // Aviator 版本，用于通用表达式和公式计算能力。
    aviatorVersion = '5.4.3'
    // TTL 版本，用于线程池场景下的 ThreadLocal 上下文传递。
    ttlVersion = '2.14.5'
    // Javax Mail 版本，当前 Hutool Mail 仍依赖 javax.mail 体系。
    javaxMailVersion = '1.4.7'
    // 阿里云 FNF SDK 版本，用于函数工作流调用能力。
    aliyunFnfVersion = '1.9.0'
    // Orika 版本，用于 BeanMapper 对象映射能力。
    orikaVersion = '1.5.4'
    // XXL-JOB 版本，与当前 XXL-JOB Admin 2.4.0 保持一致。
    xxlJobVersion = '2.4.0'
}

// 项目级仓库配置是依赖拉取的唯一入口，避免 settings.gradle 覆盖私库注入策略。
repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public' }
    if (privateMavenUrl.isPresent()) {
        maven {
            name = 'privateRelease'
            url = uri(privateMavenUrl.get())
            if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                credentials {
                    username = privateMavenUsername.get()
                    password = privateMavenPassword.get()
                }
            }
        }
    }
}

// 配置 Java 编译目标。
java {
    // 使用 Java 17 toolchain，保证本地 JDK 环境不一致时仍按 Java 17 编译。
    toolchain {
        // 指定 Java 语言版本为 17。
        languageVersion = JavaLanguageVersion.of(javaReleaseVersion)
    }
    // 同时发布源码 jar，方便消费者项目和 IDE 查看源码。
    withSourcesJar()
    // 同时发布 JavaDoc jar，方便标准 Maven 元数据完整。
    withJavadocJar()
}

// 配置 Java 编译任务。
tasks.withType(JavaCompile).configureEach {
    // 指定源码编码为 UTF-8，避免中文注释和枚举名乱码。
    options.encoding = 'UTF-8'
    // 指定 release 为 Java 17，控制编译输出兼容 Java 17。
    options.release = javaReleaseVersion
}

// 配置 JavaDoc 任务。
tasks.withType(Javadoc).configureEach {
    // 指定 JavaDoc 编码为 UTF-8，避免中文 JavaDoc 乱码。
    options.encoding = 'UTF-8'
    // 指定 JavaDoc 字符集为 UTF-8，保证浏览器显示正常。
    options.charSet = 'UTF-8'
    // 指定 JavaDoc 输出语言为 UTF-8。
    options.docEncoding = 'UTF-8'
    // 忽略 JavaDoc 严格检查，避免历史注释格式阻断发布。
    failOnError = false
}

// 禁用 Gradle Module Metadata，避免消费者优先读取缺少 Spring BOM 版本映射的 .module 文件。
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// 导入 Maven BOM，替代原 Spring Boot parent 和 dependencyManagement。
dependencyManagement {
    // 导入多个 BOM，统一管理 Spring 生态依赖版本。
    imports {
        // Spring Boot BOM 管理 starter、Jackson、Tomcat、Redis、Elasticsearch 等版本。
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        // Spring Cloud BOM 管理 Spring Cloud 组件版本。
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // Spring Cloud Alibaba BOM 管理 Nacos、Seata Alibaba 组件版本。
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.alibaba.nacos'
                && (details.requested.name == 'nacos-client' || details.requested.name.startsWith('nacos-'))) {
            details.useVersion nacosClientVersion
            details.because 'Nacos client must match the 3.2.2 server line used by the shared microservice environment.'
        }
        if (details.requested.group == 'org.apache.seata') {
            details.useVersion seataVersion
            details.because 'Seata client modules must stay on the latest published Apache Seata 2.x client line.'
        }
    }
}

// 声明项目依赖。
dependencies {
    // Dubbo：提供 RPC 声明式服务发布、引用和 Triple 协议能力。
    api "org.apache.dubbo:dubbo-spring-boot-starter:${dubboVersion}"
    // Dubbo Nacos Registry：让 Dubbo 服务复用当前 Nacos 3.2.2 注册中心。
    api "org.apache.dubbo:dubbo-registry-nacos:${dubboVersion}"
    // Spring AMQP：提供 RabbitMQ 消息队列支持。
    api 'org.springframework.boot:spring-boot-starter-amqp'
    // WebSocket：提供 WebSocket 会话和消息推送能力。
    api 'org.springframework.boot:spring-boot-starter-websocket'
    // Validation：提供 jakarta.validation 参数校验能力。
    api 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Web：提供 Spring MVC、Servlet、HTTP 请求处理能力。
    api 'org.springframework.boot:spring-boot-starter-web'
    // Jackson 3：JsonUtil 的公共 API 直接使用 Spring Boot 4 默认 JSON 实现，避免回退到 Jackson 2。
    api 'org.springframework.boot:spring-boot-starter-jackson'
    // Spring Actuator：提供自定义管理端点和 WebEndpointHandlerMapping 支持。
    api 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring AspectJ：提供切面、请求日志、参数校验和幂等拦截能力。
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    // Spring Security：提供认证过滤器、安全上下文和权限模型支持。
    api 'org.springframework.boot:spring-boot-starter-security'
    // Elasticsearch：提供 ES 日志索引 Repository 支持。
    api 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    // Redis：提供 RedisTemplate、缓存配置和 Redis 连接能力。
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    // Jedis：提供 Redis Jedis 客户端连接工厂支持。
    api 'redis.clients:jedis'
    // MySQL Driver：提供 MySQL JDBC 驱动。
    api 'com.mysql:mysql-connector-j'
    // Spring JDBC：提供 DataSource、JdbcTemplate 和事务基础能力。
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    // Druid：提供 Spring Boot 4 下的 Druid 数据库连接池。
    api "com.alibaba:druid-spring-boot-4-starter:${druidVersion}"
    // Dynamic Datasource：提供 Spring Boot 4 动态数据源切换能力。
    api "com.baomidou:dynamic-datasource-spring-boot4-starter:${dynamicDatasourceVersion}"
    // MyBatis-Plus Boot4 Starter：提供 MyBatis-Plus 自动配置能力。
    api "com.baomidou:mybatis-plus-spring-boot4-starter:${mybatisPlusVersion}"
    // MyBatis-Plus Core：提供 BaseMapper、条件构造器等核心能力。
    api "com.baomidou:mybatis-plus:${mybatisPlusVersion}"
    // MyBatis-Plus JSQLParser：提供租户插件、分页插件等 SQL 解析能力。
    api "com.baomidou:mybatis-plus-jsqlparser:${mybatisPlusVersion}"
    // MyBatis Mate：提供 MyBatis-Plus 企业增强能力。
    api "com.baomidou:mybatis-mate-starter:${mybatisMateVersion}"
    // Aliyun OSS：提供阿里云对象存储上传、下载、签名能力。
    api "com.aliyun.oss:aliyun-sdk-oss:${aliyunOssVersion}"
    // Aliyun Core：提供阿里云短信、STS、函数工作流等 SDK 基础客户端。
    api "com.aliyun:aliyun-java-sdk-core:${aliyunCoreVersion}"
    // Hutool：提供常用集合、转换、加密、Spring、Excel 等工具能力。
    api "cn.hutool:hutool-all:${hutoolVersion}"
    // Redisson：提供 Redis 分布式锁和 RedissonClient 自动配置能力。
    api "org.redisson:redisson-spring-boot-starter:${redissonVersion}"
    // Springdoc OpenAPI：提供标准 OpenAPI3 /v3/api-docs 能力，不引入第三方文档 UI。
    api "org.springdoc:springdoc-openapi-starter-webmvc-api:${springdocVersion}"
    // JJWT：提供 JWT 生成和解析能力。
    api "io.jsonwebtoken:jjwt:${jjwtVersion}"
    // OkHttp：提供 HTTP 客户端请求能力。
    api "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    // Guava：提供 Google 通用集合和工具能力。
    api "com.google.guava:guava:${guavaVersion}"
    // Apache Commons Collections：提供集合增强工具能力。
    api "org.apache.commons:commons-collections4:${commonsCollectionsVersion}"
    // Apache POI：提供 Office 文档和 Excel 处理能力。
    api "org.apache.poi:poi-ooxml:${poiVersion}"
    // iText 7 core：提供 kernel/io/layout/forms 等 PDF 生成与表单处理能力。
    api "com.itextpdf:itext7-core:${itextVersion}"
    // iText font-asian：提供 STSong-Light 等 CJK 字体的 CMap 资源。
    api "com.itextpdf:font-asian:${fontAsianVersion}"
    // PDFBox：提供 PDF 渲染、读取和页面处理能力。
    api "org.apache.pdfbox:pdfbox:${pdfboxVersion}"
    // Dozer：提供对象之间的属性映射能力。
    api "com.github.dozermapper:dozer-core:${dozerVersion}"
    // Spring Cloud Alibaba Seata：提供 Spring Cloud Alibaba 体系下的 Seata 集成能力。
    api 'com.alibaba.cloud:spring-cloud-starter-alibaba-seata'
    // Aviator：提供表达式公式计算能力。
    api "com.googlecode.aviator:aviator:${aviatorVersion}"
    // TTL：提供线程池场景下的 ThreadLocal 上下文传递能力。
    api "com.alibaba:transmittable-thread-local:${ttlVersion}"
    // Javax Mail：提供历史邮件发送能力，当前代码仍依赖 javax.mail 包。
    api "javax.mail:mail:${javaxMailVersion}"
    // Aliyun FNF：提供阿里云函数工作流 API。
    api "com.aliyun:aliyun-java-sdk-fnf:${aliyunFnfVersion}"
    // Orika：提供 BeanMapper 使用的对象映射能力。
    api "ma.glasnost.orika:orika-core:${orikaVersion}"
    // XXL-JOB Core：提供分布式任务执行器注册、心跳和 JobHandler 调度能力。
    api "com.xuxueli:xxl-job-core:${xxlJobVersion}"
    // Nacos Discovery：提供服务注册发现和优雅停机端点依赖的 Nacos 注册对象。
    api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    // Lombok 编译期注解：源码中使用 @Getter、@Data、@Slf4j 等注解。
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    // Lombok 注解处理器：编译时生成 Lombok 代码。
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    // Lombok 测试编译期注解：预留测试代码使用 Lombok。
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    // Lombok 测试注解处理器：预留测试编译时生成 Lombok 代码。
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    // Spring Boot Test：提供 JUnit、AssertJ、Mockito、Spring Test 等测试能力。
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 对齐 Gradle 测试运行器与 JUnit Platform Launcher 版本，避免测试发现阶段版本错配。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 配置测试任务。
tasks.named('test') {
    // 使用 JUnit Platform，兼容 JUnit 5 测试。
    useJUnitPlatform()
}

// 配置 Maven 发布。
publishing {
    // 定义发布产物。
    publications {
        // 定义名为 mavenJava 的 Maven 发布。
        mavenJava(MavenPublication) {
            // 从 Java 组件发布 jar、sourcesJar、javadocJar。
            from components.java
            // 显式设置 artifactId，保持 Maven 坐标 com.kellen:utils:<version> 中的 artifactId 稳定。
            artifactId = 'utils'
            // 把 BOM 管理出的真实依赖版本写进发布 POM，避免消费者解析到无版本传递依赖。
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    // 定义发布仓库。
    repositories {
        // 发布到本机 Maven Local，供消费者项目使用当前 com.kellen:utils:<version> 做本地验证。
        mavenLocal()
        // 仅在显式配置私库地址时创建远程发布任务；开源仓库不保存地址或密钥。
        if (privateMavenUrl.isPresent()) {
            maven {
                name = 'privateRelease'
                url = uri(privateMavenUrl.get())
                if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                    credentials {
                        username = privateMavenUsername.get()
                        password = privateMavenPassword.get()
                    }
                }
            }
        }
    }
}
