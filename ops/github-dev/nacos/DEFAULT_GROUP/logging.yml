# 配置分类：安全与可观测性
# dataId：logging.yml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：全局日志等级与安全结构化HTTP/AI投影白名单。
# 导入服务：ai、ai-agent、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：白名单与本机runtime及两道Collector边界同步；真实凭据不进Git。

logging:
  level:
    # 默认日志级别；提高到 DEBUG/TRACE 前评估日志量与敏感信息泄露。
    root: INFO
    # 应用 Java 包日志级别；包名与 Maven group 的环境隔离无关。
    com.kellen: INFO
    # Spring AI 默认聚合器会记录原始模型异常；仅保留元数据指标/span。
    org.springframework.ai.chat.model.MessageAggregator: "OFF"
    # 禁止观察处理器重复输出模型正文/原始异常，失败由安全结果指标表达。
    org.springframework.ai.model.observation.ErrorLoggingObservationHandler: "OFF"
  structured:
    ecs:
      service:
        # 与服务 JVM 的 OTel service.name 一致；缺名称明确标为 unknown。
        name: ${spring.application.name:unknown}
        # 部署时注入与 OTel service.version 相同的制品版本；缺值明确标为 unknown。
        version: ${spring.application.version:unknown}
        # 本共享模板只属于 github-dev；环境不能由活动 trace 或业务 MDC 推定。
        environment: github-dev
    format:
      # Boot 4 ECS；OTel agent 的 trace_id/span_id 作为 MDC 元数据关联。
      console: ecs
    json:
      context:
        # 关闭 Boot 自由 MDC/KVP 合流；共享安全 SPI 仅输出固定字段，同名键只写一次。
        # 必须与 fleet-observability >= 0.1.1 一起发布，不能单独关闭业务事件字段。
        include: false
      # 仅允许固定结构字段；未知 MDC、原始日志正文与异常不会被采集。
      include: "@timestamp,log,log.level,service,service.name,service.version,service.environment,event,summary,http_method,http_route,request_body,response_body,request_body_omitted,response_body_omitted,error_type,error_code,outcome,stage,trace_id,span_id,ai_operation,ai_provider,ai_model,ai_response_model,ai_prompt_key,ai_prompt_version,ai_prompt_source,ai_reasoning_kind,ai_finish_reason,ai_input_summary,ai_output_summary,request_bytes,response_bytes,ai_input_tokens,ai_output_tokens,ai_reasoning_tokens,ai_input_characters,ai_output_characters,ai_message_count,ai_document_count,request_body_complete,response_body_complete,ai_usage_available,ai_reasoning_present,duration_ms,http_status"
