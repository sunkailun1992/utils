# 配置分类：服务配置
# dataId：user-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：用户服务主/灰度数据源与 OAuth 授权服务器公开入口。
# 导入服务：user。
# 维护：本轮迁移个人 PostgreSQL 数据源；其它业务值和顺序保持，凭据只在私有配置。

# 数据源新键，utils 1.6.9 起由 dynamic-datasource 原生配置读取；连接池、Seata 等参数在服务 application.yml。
spring:
  # Spring 数据源配置。
  datasource:
    # dynamic-datasource 多数据源配置。
    dynamic:
      # 数据源清单，名称与灰度路由的 master、gray 一致。
      datasource:
        # user 主库。
        master:
          # 个人 PostgreSQL JDBC URL，库名与服务匹配；不带 connectTimeout、socketTimeout（Druid 初始化时会把其中的秒数当毫秒），连接与读取超时由 application.yml 的 druid 毫秒参数提供。
          url: jdbc:postgresql://${custom.infra-postgresql-host}:${custom.infra-postgresql-port}/github_dev_user?tcpKeepAlive=true
          # 主库数据库账号；仅授予对应个人独立库所需权限。
          username: ${GITHUB_POSTGRESQL_USER_USERNAME}
          # 主库数据库密码；真实值仅在私有配置中。
          password: ${GITHUB_POSTGRESQL_USER_PASSWORD}
          # PostgreSQL JDBC 驱动类。
          driver-class-name: org.postgresql.Driver
        # 灰度库；当前与主库同库，按灰度标签切换时使用。
        gray:
          # 灰度库复用主库的 JDBC URL。
          url: ${spring.datasource.dynamic.datasource.master.url}
          # 灰度库复用主库的数据库账号。
          username: ${spring.datasource.dynamic.datasource.master.username}
          # 灰度库复用主库的数据库密码；真实值仅在私有配置中。
          password: ${spring.datasource.dynamic.datasource.master.password}
          # 灰度库复用主库的 PostgreSQL JDBC 驱动类。
          driver-class-name: ${spring.datasource.dynamic.datasource.master.driver-class-name}
  # Spring Security；第5阶段起由 utils 2.0.0 的 OAuth2 资源服务器读取，还在用旧版 utils 的服务没有对应依赖，不读这些键。
  security:
    # OAuth2 相关配置。
    oauth2:
      # 资源服务器：只认 Keycloak 签发、受众正确的 RS256 访问令牌（utils docs/ai-coding/AUTH_SPEC.md）。
      resourceserver:
        # JWT 访问令牌的校验参数。
        jwt:
          # 签发方，引用 reuse-configuration.yaml 的 Keycloak 共享键；公钥按需从发现文档取，Keycloak 不可达时启动不受影响、受保护接口返回 401。
          issuer-uri: ${custom.keycloak-issuer-uri}
          # 只收 RS256 签名。
          jws-algorithms: RS256
          # 受众：后端接口统一为 github-api。
          audiences: github-api
      # 出站 OAuth2 客户端：由 utils 2.0.0 的 FleetOAuth2Clients 按注册 ID 取令牌。
      client:
        # 令牌端点所在的提供方；只配 token-uri、不配 issuer-uri，免得启动时做发现、Keycloak 不可达就起不来。
        provider:
          # Keycloak（github-dev 域）。
          keycloak:
            # 令牌端点，由签发方拼出。
            token-uri: ${custom.keycloak-issuer-uri}/protocol/openid-connect/token
        # 客户端注册，键为注册 ID。
        registration:
          # 调 Keycloak 管理接口：客户端凭证，服务账号只有 manage-users、view-users。
          keycloak-admin:
            # 令牌端点所在的提供方。
            provider: keycloak
            # Keycloak 客户端 ID。
            client-id: github-user-admin
            # 客户端密钥；真实值仅在私有配置中。
            client-secret: ${GITHUB_KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
            # 授权类型：客户端凭证。
            authorization-grant-type: client_credentials

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
oauth:
  # 用户服务内置的 OAuth 授权服务器。
  authorization-server:
    # OAuth 对外公开入口，用于授权服务器元数据；通过网关访问时保持一致。
    external-base-url: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}

# RocketMQ 发送配置，由 utils 1.7.2 起的消息模块与 rocketmq-spring 读取；配了 name-server 与 producer.group 才建生产者。
rocketmq:
  # NameServer 地址，引用 reuse-configuration.yaml 的 RocketMQ 共享键。
  name-server: ${custom.infra-rocketmq-host}:${custom.infra-rocketmq-port}
  # 生产者配置。
  producer:
    # 生产者组，命名 github-dev-<服务>-producer。
    group: github-dev-user-producer
    # user 的 RocketMQ 账号（ACL 2.0），只授权发送账号已创建事件。
    access-key: ${GITHUB_ROCKETMQ_USER_ACCESS_KEY}
    # user 的 RocketMQ 口令；真实值仅在私有配置中。
    secret-key: ${GITHUB_ROCKETMQ_USER_SECRET_KEY}

# 消息主题名，代码用 ${fleet.mq.topic.*} 引用，不在代码里写死。
fleet:
  # 消息队列相关名称。
  mq:
    # 本服务发送的主题。
    topic:
      # 账号已创建事件的主题，message 订阅。
      user-account-created: github-dev-user-account-created
  # Keycloak 账号同步：第5阶段起 user 经 Admin REST API 建、改、停用、删除账号。
  keycloak:
    # 管理接口。
    admin:
      # 签发方；管理接口地址由它推出（/realms/<域> 换成 /admin/realms/<域>）。
      issuer-uri: ${custom.keycloak-issuer-uri}
      # 取管理令牌的客户端注册 ID（spring.security.oauth2.client.registration 下同名项）。
      client-registration-id: keycloak-admin
