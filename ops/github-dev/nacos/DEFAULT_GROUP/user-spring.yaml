# 配置分类：服务配置
# dataId：user-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：用户服务主/灰度数据源与 OAuth 授权服务器公开入口。
# 导入服务：user。
# 维护：本轮迁移个人 PostgreSQL 数据源；其它业务值和顺序保持，凭据只在私有配置。

postgresql:
  # 个人 PostgreSQL JDBC URL；连接超时3秒、socket超时30秒，库名与服务匹配。
  url: jdbc:postgresql://${custom.infra-postgresql-host}:${custom.infra-postgresql-port}/github_dev_user?connectTimeout=3&socketTimeout=30&tcpKeepAlive=true
  # 个人主数据源的数据库账号；仅授予对应个人独立库所需权限。
  username: ${GITHUB_POSTGRESQL_USER_USERNAME}
  # 个人主数据源的数据库密码；真实值仅在私有配置中。
  password: ${GITHUB_POSTGRESQL_USER_PASSWORD}
  # 个人主数据源的PostgreSQL JDBC 驱动类。
  driverClassName: org.postgresql.Driver
postgresql-gray:
  # 灰度数据源复用主数据源的JDBC URL，库名与服务匹配。
  url: ${postgresql.url}
  # 灰度数据源复用主数据源的数据库账号；仅授予对应个人独立库所需权限。
  username: ${postgresql.username}
  # 灰度数据源复用主数据源的数据库密码；真实值仅在私有配置中。
  password: ${postgresql.password}
  # 灰度数据源复用主数据源的PostgreSQL JDBC 驱动类。
  driverClassName: ${postgresql.driverClassName}

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
oauth:
  authorization-server:
    # OAuth 对外公开入口，用于授权服务器元数据；通过网关访问时保持一致。
    external-base-url: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
