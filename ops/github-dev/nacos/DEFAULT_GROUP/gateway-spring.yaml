spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: '#{@ipKeyResolver}'
          routes:
            - id: github-user
              uri: lb://user
              order: 0
              predicates:
                - Path=/auth/**,/oauth2/**,/.well-known/oauth-authorization-server,/.well-known/openid-configuration
            - id: github-user-prefixed
              uri: lb://user
              order: 1
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            - id: github-message
              uri: lb://message
              order: 2
              predicates:
                - Path=/message/**
              filters:
                - StripPrefix=1
            - id: github-report
              uri: lb://report
              order: 3
              predicates:
                - Path=/report/**
              filters:
                - StripPrefix=1
            - id: github-mcp
              uri: lb://mcp
              order: 4
              predicates:
                - Path=/api/mcp/**,/.well-known/oauth-protected-resource/**
            - id: github-ai-agent
              uri: lb://ai-agent
              order: 5
              predicates:
                - Path=/api/agents/**
            - id: github-ai-memory
              uri: lb://ai-memory
              order: 6
              predicates:
                - Path=/api/ai-memory/**
            - id: github-rag
              uri: lb://rag
              order: 7
              predicates:
                - Path=/api/rag/**
            - id: github-ai
              uri: lb://ai
              order: 8
              predicates:
                - Path=/api/**
gateway:
  cors:
    allowed-origins:
      - http://localhost:8000
      - http://127.0.0.1:8000
