# 配置分类：服务框架
# dataId：gateway-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：网关路由、Redis 限流和浏览器 CORS 白名单。
# 导入服务：gateway。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # 全局 Redis 令牌桶限流过滤器，对所有路由生效。
            - name: RequestRateLimiter
              args:
                # 每秒补充的令牌数；当前为每秒 10 个令牌。
                redis-rate-limiter.replenishRate: 10
                # 令牌桶容量；当前最多允许 20 个令牌的突发请求。
                redis-rate-limiter.burstCapacity: 20
                # 每个请求消耗的令牌数；须与补充速率配套。
                redis-rate-limiter.requestedTokens: 1
                # 使用网关已有的 IP key resolver；不直接信任任意代理头。
                key-resolver: '#{@ipKeyResolver}'
          routes:
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-user
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://user
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 0
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/auth/**,/oauth2/**,/.well-known/oauth-authorization-server,/.well-known/openid-configuration
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-user-prefixed
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://user
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 1
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/user/**
              filters:
                # 剥离一个外层服务前缀；下游 Controller 路径本身保持不变。
                - StripPrefix=1
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-message
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://message
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 2
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/message/**
              filters:
                # 剥离一个外层服务前缀；下游 Controller 路径本身保持不变。
                - StripPrefix=1
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-report
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://report
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 3
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/report/**
              filters:
                # 剥离一个外层服务前缀；下游 Controller 路径本身保持不变。
                - StripPrefix=1
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-mcp
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://mcp
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 4
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/api/mcp/**,/.well-known/oauth-protected-resource/**
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-ai-agent
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://ai-agent
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 5
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/api/agents/**
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-ai-memory
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://ai-memory
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 6
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/api/ai-memory/**
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-rag
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://rag
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 7
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/api/rag/**
            # 路由唯一标识，便于诊断匹配结果。
            - id: github-ai
              # 按 Nacos 服务名负载均衡转发；目标服务必须在同一隔离空间注册。
              uri: lb://ai
              # 路由匹配优先级，数值越小越先匹配；通配 AI 路由必须排在专属路由之后。
              order: 8
              predicates:
                # 客户端请求路径匹配规则；按 Controller 原生前缀配置，不能额外添加 /rag 等前缀。
                - Path=/api/**
gateway:
  cors:
    allowed-origins:
      # 允许携带凭据的浏览器 Origin，必须精确匹配协议、主机、端口，不使用 *。
      - http://localhost:8000
      # 允许携带凭据的浏览器 Origin，必须精确匹配协议、主机、端口，不使用 *。
      - http://127.0.0.1:8000
