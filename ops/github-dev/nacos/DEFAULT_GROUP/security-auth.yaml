# 配置分类：安全与可观测性
# dataId：security-auth.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：数据权限与租户隔离。
# 导入服务：ai-memory、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

# utils 安全组件参数。
security:
  # 数据权限：按用户、部门归属列追加查询条件。
  data-permission:
    # 启用数据权限拦截；只过滤下面列出的表，未写列名时用 utils 默认的本人列 create_by、部门列 create_dept。
    enabled: true
    # 按表覆盖默认归属列，键为表名。
    table-rules:
      # 用户表：本人按主键 id 判定，部门按 dept_id。
      auth_user:
        # 该表数据权限使用的用户归属列；必须与实际表结构一致。
        user-column: id
        # 该表数据权限使用的部门归属列；必须与实际表结构一致。
        dept-column: dept_id
      # 部门表：部门按主键 id 判定，负责人按 owner_user_id。
      auth_dept:
        # 该表数据权限使用的用户归属列；必须与实际表结构一致。
        user-column: owner_user_id
        # 该表数据权限使用的部门归属列；必须与实际表结构一致。
        dept-column: id
      # 角色表：负责人按 owner_user_id，部门按 dept_id。
      auth_role:
        # 该表数据权限使用的用户归属列；必须与实际表结构一致。
        user-column: owner_user_id
        # 该表数据权限使用的部门归属列；必须与实际表结构一致。
        dept-column: dept_id
# utils 多租户隔离参数。
tenant:
  # 启用租户隔离，租户上下文由可信认证链提供。
  enabled: true
  # 缺少租户上下文时不得自动忽略租户隔离。
  ignore-without-tenant: false
