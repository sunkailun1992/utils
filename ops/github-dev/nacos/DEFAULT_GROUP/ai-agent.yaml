# 配置分类：服务专属
# dataId：ai-agent.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：Agent 模型、注册、Prompt 同步和服务身份边界。
# 导入服务：ai-agent。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

ai:
  prompts:
    sync:
      # 关闭启动时的 Prompt 同步，避免导入既有演示或业务 Prompt。
      enabled: false
    nacos:
      # 关闭 Prompt 的 Nacos 配置源；连接值保留供显式启用时使用。
      enabled: false
      # Nacos 应用端连接地址，引用本地引导变量；不使用控制台端口。
      server-addr: ${custom.nacos-ip}
      # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
      namespace: ${custom.namespace}
      # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
      username: ${custom.nacos-username:}
      # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
      password: ${custom.nacos-password:}
  agent:
    # Agent 执行模型提供方；应与所选模型及其凭据配套。
    provider: google
    deepseek:
      # 模型或服务访问密钥；仅由私有环境注入，空占位不表示已完成接入。
      api-key: ${GITHUB_DEEPSEEK_API_KEY}
      # 模型服务 API 基址；使用提供方兼容接口，保留所需版本路径。
      base-url: ${GITHUB_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # 实际调用的模型 ID，需在所选提供方和账号中可用。
      model: ${GITHUB_DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      # 模型或服务访问密钥；仅由私有环境注入，空占位不表示已完成接入。
      api-key: ${GITHUB_QWEN_API_KEY}
      # 模型服务 API 基址；使用提供方兼容接口，保留所需版本路径。
      base-url: ${GITHUB_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 实际调用的模型 ID，需在所选提供方和账号中可用。
      model: ${GITHUB_QWEN_CHAT_MODEL:qwen-plus}
    registry:
      # 关闭 AgentCard 自动注册发布；启用前核对注册空间和公开地址。
      enabled: false
      # Nacos 应用端连接地址，引用本地引导变量；不使用控制台端口。
      server-addr: ${custom.nacos-ip}
      # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
      namespace: ${custom.namespace}
      # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
      username: ${custom.nacos-username:}
      # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
      password: ${custom.nacos-password:}
      # 注册信息对调用方暴露的基址；必须是调用方可达的网关入口。
      public-base-url: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
    security:
      # 当前 Agent 服务提供方编码，参与服务身份验证。
      provider-code: github-agent
      # 允许调用的客户端 ID；与 AI 侧 client-id 配套，多个值按绑定类型配置。
      allowed-client-ids: ${GITHUB_AGENT_CLIENT_ID:github-ai}
      # 签名请求体的最大字节数；33554432 字节为 32 MiB。
      max-body-bytes: 33554432
