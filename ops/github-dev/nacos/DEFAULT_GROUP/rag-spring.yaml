# 配置分类：服务配置
# dataId：rag-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：RAG 主/灰度数据源、独立向量集合、嵌入模型和解析/检索引擎。
# 导入服务：rag。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

mysql:
  # 个人主数据源的JDBC URL，库名与服务匹配。
  url: jdbc:mysql://${custom.infra-mysql-host}:${custom.infra-mysql-port}/github_dev_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  # 个人主数据源的数据库账号；仅授予个人 schema 所需权限。
  username: ${GITHUB_MYSQL_USERNAME}
  # 个人主数据源的数据库密码；真实值仅在私有配置中。
  password: ${GITHUB_MYSQL_PASSWORD}
  # 个人主数据源的MySQL JDBC 驱动类。
  driverClassName: com.mysql.cj.jdbc.Driver
mysql-gray:
  # 灰度数据源复用主数据源的JDBC URL，库名与服务匹配。
  url: ${mysql.url}
  # 灰度数据源复用主数据源的数据库账号；仅授予个人 schema 所需权限。
  username: ${mysql.username}
  # 灰度数据源复用主数据源的数据库密码；真实值仅在私有配置中。
  password: ${mysql.password}
  # 灰度数据源复用主数据源的MySQL JDBC 驱动类。
  driverClassName: ${mysql.driverClassName}

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
rag:
  engine:
    # PDF/PNG/JPEG 解析开关；false 保留 Office 上传，扫描件另需配置 OCR 服务。
    parse-enabled: false
    # 检索切换开关；false 使用原有 Java 链路，true 使用 Python dense 引擎；尚未启用混合检索。
    retrieval-enabled: false
    # Python 引擎根地址，格式 http(s)://host:port，不含路径；关闭两个开关时允许为空。
    base-url: ${GITHUB_RAG_ENGINE_URL:}
    # Java 与 Python 一致的内部服务密钥，至少 32 字符；不使用浏览器 JWT，禁止提交真实值。
    api-key: ${GITHUB_RAG_ENGINE_API_KEY:}
    # 解析总超时，毫秒，1000–120000；应略大于引擎的解析总预算。
    parse-timeout-millis: 65000
    # 检索 HTTP 总超时，毫秒，100–3500；上游 Dubbo 为 5000 毫秒。
    retrieval-timeout-millis: 3500
    # 最大响应体，字节；这里是 16 MiB，超限整体拒绝，不能截断后返回成功。
    max-response-bytes: 16777216
    # 单文档最大返回切片数，超过则拒绝；应与 Python 引擎上限保持一致。
    max-chunks: 1000
  vector:
    # 双写 dense/sparse 向量；默认 false。开启前完成集合 schema、历史回填和 Python hybrid 参数对齐。
    hybrid-write-enabled: ${GITHUB_RAG_HYBRID_WRITE_ENABLED:false}
    # 启用 RAG 向量能力；实际检索和嵌入仍需 Qdrant 与模型服务可用。
    enabled: true
    # RAG 使用 Qdrant HTTP REST 入口 6333，与共享 gRPC 6334 区分。
    qdrant-url: http://${GITHUB_QDRANT_HOST}:6333
    # 个人文档向量集合名，避免读取或覆盖公司集合。
    collection-name: github_dev_rag
    # 嵌入模型的 OpenAI 兼容 API 基址；保留 /v1 路径契约。
    qwen-base-url: ${GITHUB_RAG_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # RAG 嵌入模型密钥；真实值由私有环境注入，不写入 Git。
    qwen-api-key: ${GITHUB_RAG_QWEN_API_KEY}
