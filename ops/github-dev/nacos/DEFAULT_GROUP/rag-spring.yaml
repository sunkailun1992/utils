# 配置分类：服务配置
# dataId：rag-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：RAG 主/灰度数据源、独立向量集合、嵌入模型和解析/检索引擎。
# 导入服务：rag。
# 维护：引擎地址与密钥、混合写入、默认知识库、嵌入网关地址以远端为准，发布须用 render_nacos.py --remote/--keep-remote 保值渲染；凭据只在私有配置。

# 数据源新键，utils 1.6.9 起由 dynamic-datasource 原生配置读取；连接池、Seata 等参数在服务 application.yml。
spring:
  # Spring 数据源配置。
  datasource:
    # dynamic-datasource 多数据源配置。
    dynamic:
      # 数据源清单，名称与灰度路由的 master、gray 一致。
      datasource:
        # rag 主库。
        master:
          # 个人 PostgreSQL JDBC URL，库名与服务匹配；不带 connectTimeout、socketTimeout（Druid 初始化时会把其中的秒数当毫秒），连接与读取超时由 application.yml 的 druid 毫秒参数提供。
          url: jdbc:postgresql://${custom.infra-postgresql-host}:${custom.infra-postgresql-port}/github_dev_rag?tcpKeepAlive=true
          # 主库数据库账号；仅授予对应个人独立库所需权限。
          username: ${GITHUB_POSTGRESQL_RAG_USERNAME}
          # 主库数据库密码；真实值仅在私有配置中。
          password: ${GITHUB_POSTGRESQL_RAG_PASSWORD}
          # PostgreSQL JDBC 驱动类。
          driver-class-name: org.postgresql.Driver
        # 灰度库；当前与主库同库，按灰度标签切换时使用。
        gray:
          # 灰度库复用主库的 JDBC URL。
          url: ${spring.datasource.dynamic.datasource.master.url}
          # 灰度库复用主库的数据库账号。
          username: ${spring.datasource.dynamic.datasource.master.username}
          # 灰度库复用主库的数据库密码；真实值仅在私有配置中。
          password: ${spring.datasource.dynamic.datasource.master.password}
          # 灰度库复用主库的 PostgreSQL JDBC 驱动类。
          driver-class-name: ${spring.datasource.dynamic.datasource.master.driver-class-name}
  # Spring Security；第5阶段起由 utils 2.0.0 的 OAuth2 资源服务器读取，还在用旧版 utils 的服务没有对应依赖，不读这些键。
  security:
    # OAuth2 相关配置。
    oauth2:
      # 资源服务器：只认 Keycloak 签发、受众正确的 RS256 访问令牌（utils docs/ai-coding/AUTH_SPEC.md）。
      resourceserver:
        # JWT 访问令牌的校验参数。
        jwt:
          # 签发方，引用 reuse-configuration.yaml 的 Keycloak 共享键；公钥按需从发现文档取，Keycloak 不可达时启动不受影响、受保护接口返回 401。
          issuer-uri: ${custom.keycloak-issuer-uri}
          # 只收 RS256 签名。
          jws-algorithms: RS256
          # 受众：后端接口统一为 github-api。
          audiences: github-api
      # 出站 OAuth2 客户端：由 utils 2.0.0 的 FleetOAuth2Clients 按注册 ID 取令牌。
      client:
        # 令牌端点所在的提供方；只配 token-uri、不配 issuer-uri，免得启动时做发现、Keycloak 不可达就起不来。
        provider:
          # Keycloak（github-dev 域）。
          keycloak:
            # 令牌端点，由签发方拼出。
            token-uri: ${custom.keycloak-issuer-uri}/protocol/openid-connect/token
        # 客户端注册，键为注册 ID。
        registration:
          # 调 RAG 引擎：客户端凭证，令牌受众 github-rag-engine。
          github-rag-engine:
            # 令牌端点所在的提供方。
            provider: keycloak
            # Keycloak 客户端 ID。
            client-id: github-rag
            # 客户端密钥；真实值仅在私有配置中。
            client-secret: ${GITHUB_KEYCLOAK_RAG_CLIENT_SECRET}
            # 授权类型：客户端凭证。
            authorization-grant-type: client_credentials

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
rag:
  # Python RAG 引擎（解析、检索、图谱）的调用参数，由 RagEngineProperties 绑定。
  engine:
    # PDF/PNG/JPEG 解析开关；false 只保留 Office 上传，扫描件另需引擎侧 OCR。
    parse-enabled: true
    # 图构建提交、图查询及删除屏障的 HTTP 总超时，毫秒；独立于异步构建总预算和检索预算。
    graph-timeout-millis: 10000
    # 异步图构建状态查询 HTTP 总超时，毫秒；失败由前端明确显示，不解释为构建完成。
    graph-status-timeout-millis: 3500
    # Python 引擎根地址，格式 http(s)://host:port，不含路径；github-dev 远端为 NAS 上的引擎，空值将明确降级/报错，不转回旧实现。
    base-url: ${GITHUB_RAG_ENGINE_URL:}
    # Java 与 Python 一致的内部服务密钥，至少 32 字符；不使用浏览器 JWT，真实值只在远端与引擎侧，禁止提交。
    api-key: ${GITHUB_RAG_ENGINE_API_KEY:}
    # 解析总超时，毫秒，1000–120000；应略大于引擎的解析总预算。
    parse-timeout-millis: 65000
    # 检索 HTTP 总超时，毫秒，100–3500；上游 Dubbo 为 5000 毫秒。
    retrieval-timeout-millis: 3500
    # 最大响应体，字节；这里是 16 MiB，超限整体拒绝，不能截断后返回成功。
    max-response-bytes: 16777216
    # 单文档最大返回切片数，超过则拒绝；应与 Python 引擎上限保持一致。
    max-chunks: 1000
  # 向量入库与检索参数，由 RagVectorProperties 绑定。
  vector:
    # 未指定知识库时使用的知识库编码；代码默认 general-knowledge，github-dev 远端另有取值。
    default-knowledge-base: ${GITHUB_RAG_DEFAULT_KNOWLEDGE_BASE:general-knowledge}
    # 双写 dense/sparse 向量；模板默认 false，github-dev 远端已开启。开启前完成集合 schema、历史回填和 Python hybrid 参数对齐。
    hybrid-write-enabled: ${GITHUB_RAG_HYBRID_WRITE_ENABLED:false}
    # 启用 RAG 向量能力；实际检索和嵌入仍需 Qdrant 与模型服务可用。
    enabled: true
    # RAG 直连 Qdrant 的 HTTP REST 入口，端口 6333；其它服务不直接访问 Qdrant。
    qdrant-url: http://${GITHUB_QDRANT_HOST}:6333
    # 个人文档向量集合名，避免读取或覆盖公司集合。
    collection-name: github_dev_rag
    # 嵌入模型的 OpenAI 兼容 API 基址，保留 /v1 路径；github-dev 远端指向 LiteLLM 网关。
    qwen-base-url: ${GITHUB_RAG_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 嵌入模型密钥；github-dev 远端保留 ${GITHUB_RAG_QWEN_API_KEY} 原样，由 rag 进程 OS 环境在运行期解析。
    qwen-api-key: ${GITHUB_RAG_QWEN_API_KEY}
