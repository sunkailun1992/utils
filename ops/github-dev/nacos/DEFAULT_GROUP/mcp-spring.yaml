# 配置分类：服务配置
# dataId：mcp-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：MCP 主/灰度数据源、Agent 注册和 OAuth 资源服务器。
# 导入服务：mcp。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

mysql:
  # 个人主数据源的JDBC URL，库名与服务匹配。
  url: jdbc:mysql://${custom.infra-mysql-host}:${custom.infra-mysql-port}/github_dev_mcp?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  # 个人主数据源的数据库账号；仅授予个人 schema 所需权限。
  username: ${GITHUB_MYSQL_USERNAME}
  # 个人主数据源的数据库密码；真实值仅在私有配置中。
  password: ${GITHUB_MYSQL_PASSWORD}
  # 个人主数据源的MySQL JDBC 驱动类。
  driverClassName: com.mysql.cj.jdbc.Driver
mysql-gray:
  # 灰度数据源复用主数据源的JDBC URL，库名与服务匹配。
  url: ${mysql.url}
  # 灰度数据源复用主数据源的数据库账号；仅授予个人 schema 所需权限。
  username: ${mysql.username}
  # 灰度数据源复用主数据源的数据库密码；真实值仅在私有配置中。
  password: ${mysql.password}
  # 灰度数据源复用主数据源的MySQL JDBC 驱动类。
  driverClassName: ${mysql.driverClassName}

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
mcp:
  server:
    registry:
      # 关闭 MCP 服务自动注册；启用前核对个人 Nacos 空间。
      enabled: false
      # Nacos 应用端连接地址，引用本地引导变量；不使用控制台端口。
      server-addr: ${custom.nacos-ip}
      # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
      namespace: ${custom.namespace}
      # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
      username: ${custom.nacos-username:}
      # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
      password: ${custom.nacos-password:}
      # 注册信息对调用方暴露的基址；必须是调用方可达的网关入口。
      public-base-url: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
  agent:
    registry:
      # 关闭 MCP 的 Agent 注册能力，避免发布未验收的 AgentCard。
      enabled: false
      # Nacos 应用端连接地址，引用本地引导变量；不使用控制台端口。
      server-addr: ${custom.nacos-ip}
      # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
      namespace: ${custom.namespace}
      # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
      username: ${custom.nacos-username:}
      # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
      password: ${custom.nacos-password:}
  oauth:
    resource-server:
      # 启用 OAuth 资源服务器校验，受保护接口必须验证访问令牌。
      enabled: true
      # 令牌签发方的公开入口，必须与授权服务器的 issuer 契约一致。
      issuer: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
      # OAuth 授权服务器公开地址，客户端通过该入口发现授权服务。
      authorization-server: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
      # MCP 面向客户端的公开基址，用于生成资源元数据地址。
      external-base-url: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}
      # 允许访问本 MCP 资源的 audience；需与授权服务器签发值一致。
      audiences: ${GITHUB_GATEWAY_PUBLIC_URL:http://localhost:7100}/api/mcp
