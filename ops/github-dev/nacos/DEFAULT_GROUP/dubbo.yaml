# 配置分类：共享基础设施
# dataId：dubbo.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：Dubbo Triple 协议和个人 namespace/group 隔离。
# 导入服务：ai、ai-agent、ai-memory、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

dubbo:
  application:
    # RPC 应用名使用个人环境前缀，保留当前 Spring 服务名。
    name: github-dev-${spring.application.name}
    # 关闭 Dubbo QoS 管理入口，避免额外暴露管理端口。
    qos-enable: false
  registry:
    # Nacos 注册地址；引用本地引导的应用端地址，不使用控制台端口。
    address: nacos://${custom.nacos-ip}
    # 个人 RPC 注册分组，避免与美联相同接口互相发现。
    group: ${custom.dubbo-group}
    # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
    username: ${custom.nacos-username:}
    # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
    password: ${custom.nacos-password:}
    parameters:
      # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
      namespace: ${custom.namespace}
  protocol:
    # RPC 使用 Triple 协议，调用双方必须兼容。
    name: tri
    # -1 由框架分配可用协议端口；固定端口时需避免本机服务冲突。
    port: -1
  consumer:
    # 启动时不因暂无 provider 直接失败；实际 RPC 调用仍需可用 provider。
    check: false
