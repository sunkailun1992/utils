# 配置分类：安全与可观测性
# dataId：admin.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：Spring Boot Admin 客户端注册开关。
# 导入服务：ai、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

spring:
  boot:
    admin:
      client:
        # 关闭向 Spring Boot Admin 注册；启用前需准备独立服务端和访问控制。
        enabled: false
