# 配置分类：共享基础设施
# dataId：redis.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：公共 Redis 缓存和 Spring Data Redis 共用连接。
# 导入服务：ai、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

redis:
  # 公共 Redis 连接主机，复用共享变量。
  hostName: ${custom.infra-redis-host}
  # Redis TCP 端口，复用共享变量。
  port: ${custom.infra-redis-port}
  # 个人 Redis 逻辑库编号；12 为当前约定，需在服务端支持的范围内。
  database: ${GITHUB_REDIS_DATABASE:12}
  # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
  password: ${GITHUB_REDIS_PASSWORD:}
  cache:
    # 缓存名-过期分钟数，逗号分隔；githubCache-30 为 30 分钟，0 表示不过期。
    cache-names: githubCache-30
spring:
  data:
    redis:
      # Spring Data Redis 与公共缓存共用同一主机。
      host: ${redis.hostName}
      # Spring Data Redis 与公共缓存共用同一 TCP 端口。
      port: ${redis.port}
      # Spring Data Redis 与公共缓存使用同一个人逻辑库。
      database: ${redis.database}
      # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
      password: ${redis.password}
