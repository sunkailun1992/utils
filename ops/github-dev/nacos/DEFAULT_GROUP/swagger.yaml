# 配置分类：安全与可观测性
# dataId：swagger.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：OpenAPI 文档和 Swagger UI 暴露开关。
# 导入服务：ai、ai-agent、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：文档开关只认 springdoc.*，统一由私有变量 GITHUB_SWAGGER_ENABLED 控制，默认关闭；真实凭据不进 Git。

# utils 的 OpenAPI 文档参数，由 utils 的 Swagger 配置读取。
swagger:
  # 文档显示名默认使用当前 Spring 服务名。
  name: ${spring.application.name}
# Springdoc OpenAPI 的暴露开关。
springdoc:
  # /v3/api-docs 文档接口。
  api-docs:
    # Springdoc OpenAPI JSON 开关；默认关闭，开启前核对文档访问保护。
    enabled: ${GITHUB_SWAGGER_ENABLED:false}
  # Swagger UI 页面。
  swagger-ui:
    # Swagger UI 页面开关；关闭 UI 不可替代关闭 API 文档接口。
    enabled: ${GITHUB_SWAGGER_ENABLED:false}
