# 配置分类：服务配置
# dataId：ai-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：AI 主/灰度数据源、演示种子、Agent 发现与调用 Agent 的令牌交换。
# 导入服务：ai。
# 维护：本轮迁移个人 PostgreSQL 数据源；其它业务值和顺序保持，凭据只在私有配置。

# 数据源新键，utils 1.6.9 起由 dynamic-datasource 原生配置读取；连接池、Seata 等参数在服务 application.yml。
spring:
  # Spring 数据源配置。
  datasource:
    # dynamic-datasource 多数据源配置。
    dynamic:
      # 数据源清单，名称与灰度路由的 master、gray 一致。
      datasource:
        # ai 主库。
        master:
          # 个人 PostgreSQL JDBC URL，库名与服务匹配；不带 connectTimeout、socketTimeout（Druid 初始化时会把其中的秒数当毫秒），连接与读取超时由 application.yml 的 druid 毫秒参数提供。
          url: jdbc:postgresql://${custom.infra-postgresql-host}:${custom.infra-postgresql-port}/github_dev_ai?tcpKeepAlive=true
          # 主库数据库账号；仅授予对应个人独立库所需权限。
          username: ${GITHUB_POSTGRESQL_AI_USERNAME}
          # 主库数据库密码；真实值仅在私有配置中。
          password: ${GITHUB_POSTGRESQL_AI_PASSWORD}
          # PostgreSQL JDBC 驱动类。
          driver-class-name: org.postgresql.Driver
        # 灰度库；当前与主库同库，按灰度标签切换时使用。
        gray:
          # 灰度库复用主库的 JDBC URL。
          url: ${spring.datasource.dynamic.datasource.master.url}
          # 灰度库复用主库的数据库账号。
          username: ${spring.datasource.dynamic.datasource.master.username}
          # 灰度库复用主库的数据库密码；真实值仅在私有配置中。
          password: ${spring.datasource.dynamic.datasource.master.password}
          # 灰度库复用主库的 PostgreSQL JDBC 驱动类。
          driver-class-name: ${spring.datasource.dynamic.datasource.master.driver-class-name}
  # Spring Security；第5阶段起由 utils 2.0.0 的 OAuth2 资源服务器读取，还在用旧版 utils 的服务没有对应依赖，不读这些键。
  security:
    # OAuth2 相关配置。
    oauth2:
      # 资源服务器：只认 Keycloak 签发、受众正确的 RS256 访问令牌（utils docs/ai-coding/AUTH_SPEC.md）。
      resourceserver:
        # JWT 访问令牌的校验参数。
        jwt:
          # 签发方，引用 reuse-configuration.yaml 的 Keycloak 共享键；公钥按需从发现文档取，Keycloak 不可达时启动不受影响、受保护接口返回 401。
          issuer-uri: ${custom.keycloak-issuer-uri}
          # 只收 RS256 签名。
          jws-algorithms: RS256
          # 受众：后端接口统一为 github-api。
          audiences: github-api
      # 出站 OAuth2 客户端：由 utils 2.0.0 的 FleetOAuth2Clients 按注册 ID 取令牌。
      client:
        # 令牌端点所在的提供方；只配 token-uri、不配 issuer-uri，免得启动时做发现、Keycloak 不可达就起不来。
        provider:
          # Keycloak（github-dev 域）。
          keycloak:
            # 令牌端点，由签发方拼出。
            token-uri: ${custom.keycloak-issuer-uri}/protocol/openid-connect/token
        # 客户端注册，键为注册 ID。
        registration:
          # 调 ai-agent：RFC 8693 令牌交换，把当前用户的令牌换成受众 github-ai-agent 的令牌。
          github-ai-agent:
            # 令牌端点所在的提供方。
            provider: keycloak
            # Keycloak 客户端 ID。
            client-id: github-ai
            # 客户端密钥；真实值仅在私有配置中。
            client-secret: ${GITHUB_KEYCLOAK_AI_CLIENT_SECRET}
            # 授权类型：标准令牌交换。
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange

# 服务专属参数，与上面的框架参数共同维护；原导入相邻且无重复键。
ai:
  # 启动初始化。
  bootstrap:
    # 关闭启动演示种子，避免自动创建历史业务数据。
    seed-demo-content: false
  # 从 Nacos AI Registry 读取 AgentCard 以发现 Agent。
  agent-registry:
    # 启用当前个人空间内的Agent发现；找不到Agent时业务保持既有失败/回退策略。
    enabled: true
    # Nacos 应用端连接地址，引用本地引导变量；不使用控制台端口。
    server-addr: ${custom.nacos-ip}
    # 引用当前个人命名空间 ID，保持配置、发现和 Registry 隔离一致。
    namespace: ${custom.namespace}
    # 连接认证用户名；引用私有环境或同一组件的公共连接配置。
    username: ${custom.nacos-username:}
    # 连接认证密码；真实值由私有环境注入或引用，禁止写入 Git 和日志。
    password: ${custom.nacos-password:}

# utils 资源服务器与出站 OAuth2 的扩展配置（第5阶段起由 utils 2.0.0 读取）。
fleet:
  # 安全相关。
  security:
    # OAuth2 扩展项。
    oauth2:
      # 出站令牌交换请求的受众，键为客户端注册 ID。
      token-exchange:
        # 调 ai-agent 时请求的受众。
        github-ai-agent:
          # RFC 8693 的 audience 参数。
          audience: github-ai-agent
