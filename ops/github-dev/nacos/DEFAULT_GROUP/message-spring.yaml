# 配置分类：服务配置
# dataId：message-spring.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：message 的主/灰度数据源；均引用对应个人独立库。
# 导入服务：message。
# 维护：本轮迁移个人 PostgreSQL 数据源；其它业务值和顺序保持，凭据只在私有配置。

# 数据源新键，utils 1.6.9 起由 dynamic-datasource 原生配置读取；连接池、Seata 等参数在服务 application.yml。
spring:
  # Spring 数据源配置。
  datasource:
    # dynamic-datasource 多数据源配置。
    dynamic:
      # 数据源清单，名称与灰度路由的 master、gray 一致。
      datasource:
        # message 主库。
        master:
          # 个人 PostgreSQL JDBC URL，库名与服务匹配；不带 connectTimeout、socketTimeout（Druid 初始化时会把其中的秒数当毫秒），连接与读取超时由 application.yml 的 druid 毫秒参数提供。
          url: jdbc:postgresql://${custom.infra-postgresql-host}:${custom.infra-postgresql-port}/github_dev_message?tcpKeepAlive=true
          # 主库数据库账号；仅授予对应个人独立库所需权限。
          username: ${GITHUB_POSTGRESQL_MESSAGE_USERNAME}
          # 主库数据库密码；真实值仅在私有配置中。
          password: ${GITHUB_POSTGRESQL_MESSAGE_PASSWORD}
          # PostgreSQL JDBC 驱动类。
          driver-class-name: org.postgresql.Driver
        # 灰度库；当前与主库同库，按灰度标签切换时使用。
        gray:
          # 灰度库复用主库的 JDBC URL。
          url: ${spring.datasource.dynamic.datasource.master.url}
          # 灰度库复用主库的数据库账号。
          username: ${spring.datasource.dynamic.datasource.master.username}
          # 灰度库复用主库的数据库密码；真实值仅在私有配置中。
          password: ${spring.datasource.dynamic.datasource.master.password}
          # 灰度库复用主库的 PostgreSQL JDBC 驱动类。
          driver-class-name: ${spring.datasource.dynamic.datasource.master.driver-class-name}

# RocketMQ 消费配置，由 utils 1.7.2 起的消息模块与 rocketmq-spring 读取；监听容器缺省读 rocketmq.consumer 的账号，不建生产者。
rocketmq:
  # NameServer 地址，引用 reuse-configuration.yaml 的 RocketMQ 共享键。
  name-server: ${custom.infra-rocketmq-host}:${custom.infra-rocketmq-port}
  # 消费者配置。
  consumer:
    # message 的 RocketMQ 账号（ACL 2.0），只授权订阅账号已创建事件与 github-dev-message-* 消费组。
    access-key: ${GITHUB_ROCKETMQ_MESSAGE_ACCESS_KEY}
    # message 的 RocketMQ 口令；真实值仅在私有配置中。
    secret-key: ${GITHUB_ROCKETMQ_MESSAGE_SECRET_KEY}

# 消息主题与消费组名，代码用 ${fleet.mq.topic.*}、${fleet.mq.group.*} 引用，不在代码里写死。
fleet:
  # 消息队列相关名称。
  mq:
    # 订阅的主题。
    topic:
      # 账号已创建事件的主题，由 user 发送。
      user-account-created: github-dev-user-account-created
    # 本服务的消费组。
    group:
      # 收账号已创建事件、发欢迎站内信；非稳定实例由消息模块自动加泳道后缀。
      user-account-created: github-dev-message-user-account-created
