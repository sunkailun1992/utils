# 配置分类：共享基础设施
# dataId：seata.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：Seata 分布式事务启用状态。
# 导入服务：ai、ai-memory、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

# Seata 客户端（seata-spring-boot-starter）设置；服务端与事务分组见各服务 profile。
seata:
  # 关闭 Seata；启用前需准备对应事务分组、服务端和 undo_log。
  enabled: false
  # 不让 Seata 自动给 DataSource Bean 包代理：AT 代理由 dynamic-datasource 按 seata 开关给各池包，再包一层会重复代理路由数据源。
  enable-auto-data-source-proxy: false
