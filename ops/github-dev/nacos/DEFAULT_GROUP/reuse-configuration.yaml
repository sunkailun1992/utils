# 配置分类：共享变量
# dataId：reuse-configuration.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：跨 dataId 引用的基础设施地址与 RPC 分组。
# 导入服务：ai、ai-agent、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：个人业务数据库迁移至 NAS PostgreSQL；其它共享变量保持既有语义，真实凭据不进 Git。

# 共享变量：其它 dataId 用 ${custom.*} 引用，代码不直接读取；改值会同时影响所有引用方。
custom:
  # 开发 PostgreSQL 主机；具体个人独立库 在各服务 -spring.yaml 中声明。
  infra-postgresql-host: ${GITHUB_POSTGRESQL_HOST}
  # PostgreSQL TCP 端口，默认 5432。
  infra-postgresql-port: ${GITHUB_POSTGRESQL_PORT:5432}
  # 开发 Redis 主机；个人逻辑库在 redis.yaml 中声明。
  infra-redis-host: ${GITHUB_REDIS_HOST}
  # Redis TCP 端口，默认 6379。
  infra-redis-port: ${GITHUB_REDIS_PORT:6379}
  # 开发 Seata Server（TC）主机，与其它共享中间件同在 NAS。
  infra-seata-host: ${GITHUB_SEATA_HOST}
  # Seata 客户端协议端口，默认 7091；NAS 上的 2.7.0 在 7091 同时提供健康检查与客户端协议，8091 不可连。
  infra-seata-port: ${GITHUB_SEATA_PORT:7091}
  # 个人 RPC 分组，所有 provider/consumer 必须使用同一值。
  dubbo-group: GITHUB_DEV_DUBBO
