# 配置分类：安全与可观测性
# dataId：security-jwt.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：人员访问 JWT 的签名密钥与签发方。
# 导入服务：ai、ai-agent、ai-memory、gateway、mcp、message、rag、report、user。
# 维护：只整理注释；配置值、占位符、列表顺序保持既有语义，真实凭据不进 Git。

security:
  jwt:
    # 人员访问 JWT 的签名密钥；空占位必须由私有配置补齐，不写入 Git。
    secret: ${GITHUB_JWT_SECRET:}
    # 人员访问令牌签发方标识；与验证方保持一致，不是租户 code。
    issuer: github-dev
