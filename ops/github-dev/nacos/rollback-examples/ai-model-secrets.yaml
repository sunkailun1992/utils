# 配置分类：历史回滚示例（不属于活跃模板）
# dataId：ai-model-secrets.yaml | group：DEFAULT_GROUP | namespace：github-dev
# 用途：Google GenAI 凭据与模型选择；真实凭据仅在私有渲染结果和 Nacos。
# 当前消费者：无；旧 ai-agent、ai-memory、rag 制品仅在负责人明确回滚时恢复原 import。
# 维护：保留原有效键、占位符和顺序；不得放回活跃 catalog、默认渲染目录或 retired 自动删除清单。
# 远端保留：当前不删除 NAS/Nacos 中的历史 dataId；回滚须使用目标环境私有备份，不能用本示例覆盖真实值。

spring:
  ai:
    google:
      genai:
        # 模型或服务访问密钥；仅由私有环境注入，空占位不表示已完成接入。
        api-key: ${GITHUB_GOOGLE_API_KEY}
        chat:
          options:
            # 实际调用的模型 ID，需在所选提供方和账号中可用。
            model: ${GITHUB_GOOGLE_CHAT_MODEL:gemini-3.1-flash-lite}
