# 用途：只接收私网认证 OTLP，在持久化前清理内容；仅此编排消费。
extensions:
  bearertokenauth/inbound:
    filename: /run/secrets/otlp_token
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/inbound
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: span
        statements:
          # 丢弃自动埋点可能附带的 URL/query、SQL、prompt、身份与原始异常。
          - keep_keys(attributes, ["http.request.method", "http.response.status_code", "http.route", "rpc.system", "rpc.service", "rpc.method", "db.system.name", "error.type", "rag.stage", "rag.mode", "rag.result", "rag.degraded", "rag.graph_augmented", "rag.graph_degraded", "rag.hit_count", "business.outcome", "outcome", "operation"])
          - set(status.message, "")
      - context: spanevent
        statements:
          - delete_matching_keys(attributes, ".*")
          - set(name, "event")
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: log
        statements:
          # 日志body可能是未审计应用消息，中心端一律不持久化。
          - set(body, "")
          - keep_keys(attributes, ["event", "duration_ms", "error_code", "outcome", "stage", "trace_id", "span_id"])
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  elasticsearch/runtime:
    endpoints: ["${env:GITHUB_ES_URL}"]
    api_key: ${env:GITHUB_ES_API_KEY}
    logs_index: github_dev_runtime_log
    # 固定 raw 映射兼容已有 ES7.17；不是要求8.12+的默认otel/ecs映射。
    mapping:
      mode: raw
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 256
      block_on_overflow: false
    retry:
      enabled: true
      max_retries: 2
      initial_interval: 1s
      max_interval: 5s
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 512
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  extensions: [bearertokenauth/inbound]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [elasticsearch/runtime]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
