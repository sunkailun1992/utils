  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  elasticsearch/runtime:
    endpoints: ["${env:GITHUB_ES_URL}"]
    api_key: ${env:GITHUB_ES_API_KEY}
    logs_index: github_dev_runtime_log
    # 0.164 已忽略 mapping.mode；只允许 raw 才能固定默认映射和普通索引合同。
    mapping:
      allowed_modes: [raw]
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 256
      block_on_overflow: false
    retry:
      enabled: true
      max_retries: 2
      initial_interval: 1s
      max_interval: 5s
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 512
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  extensions: [bearertokenauth/inbound]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [elasticsearch/runtime]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
