# 部署在实际Java/Python运行主机；只读本机安全JSON日志，不把整个Docker socket挂入。
# 同宿主时可复用中央Collector并合入filelog pipeline；跨主机则需要独立轻量采集进程。
extensions:
  file_storage/offsets:
    # Git 外/明确忽略的私有 collector-offsets 目录，由管理入口预建为 0700。
    directory: ${env:FLEET_LOG_STATE_DIR}
    create_directory: false
    fsync: true
receivers:
  filelog/runtime:
    include: ["${env:FLEET_LOG_DIR}/*.json", "${env:FLEET_LOG_DIR}/*.jsonl"]
    start_at: end
    # 初装跳过已有历史；重启使用已持久化的文件 offset 读取停机期间追加的日志。
    storage: file_storage/offsets
    include_file_path: false
    operators:
      - type: json_parser
        parse_to: attributes
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  transform/privacy:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          # 应用文件先受白名单，发出前再次移除body/未知属性，禁止出站原始日志。
          # 先逐条提取，再分组为 resource，不能直接改同批日志共享的 resource。
          - set(attributes["service.name"], attributes["service"]["name"]) where attributes["service"]["name"] != nil
          - set(attributes["service.version"], attributes["service"]["version"]) where attributes["service"]["version"] != nil
          - set(attributes["deployment.environment.name"], attributes["service"]["environment"]) where attributes["service"]["environment"] != nil
          - set(attributes["duration_ms"], attributes["elapsed_ms"]) where attributes["elapsed_ms"] != nil
          - set(attributes["outcome"], attributes["result"]) where attributes["result"] != nil
          # 只映射有限等级；未知/非法类型保持 UNSPECIFIED，不把自由文本提升为标准字段。
          - set(severity_text, "") where attributes["log"]["level"] != nil
          - set(severity_number, SEVERITY_NUMBER_UNSPECIFIED) where attributes["log"]["level"] != nil
          - set(severity_text, attributes["log"]["level"]) where IsString(attributes["log"]["level"]) and IsMatch(attributes["log"]["level"], "^(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)$")
          - set(severity_number, SEVERITY_NUMBER_TRACE) where severity_text == "TRACE"
          - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
          - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
          - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
          - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
          - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
          - set(body, "")
          # HTTP/AI投影来自应用有界白名单；保留可读summary，原始message/body始终清空。
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name", "event", "summary", "http_method", "http_route", "request_body", "response_body", "request_body_omitted", "response_body_omitted", "error_type", "error_code", "outcome", "stage", "trace_id", "span_id", "ai_operation", "ai_provider", "ai_model", "ai_response_model", "ai_prompt_key", "ai_prompt_version", "ai_prompt_source", "ai_reasoning_kind", "ai_finish_reason", "ai_input_summary", "ai_output_summary", "request_bytes", "response_bytes", "ai_input_tokens", "ai_output_tokens", "ai_reasoning_tokens", "ai_input_characters", "ai_output_characters", "ai_message_count", "ai_document_count", "request_body_complete", "response_body_complete", "ai_usage_available", "ai_reasoning_present", "duration_ms", "http_status", "traffic_route_mode", "traffic_route_decision", "traffic_route_hop"])
          - delete_key(attributes, "event") where attributes["event"] != nil and not IsString(attributes["event"])
          - delete_key(attributes, "event") where IsString(attributes["event"]) and Len(attributes["event"]) > 64
          - delete_key(attributes, "summary") where attributes["summary"] != nil and not IsString(attributes["summary"])
          - delete_key(attributes, "summary") where IsString(attributes["summary"]) and Len(attributes["summary"]) > 512
          - delete_key(attributes, "http_method") where attributes["http_method"] != nil and not IsString(attributes["http_method"])
          - delete_key(attributes, "http_method") where IsString(attributes["http_method"]) and Len(attributes["http_method"]) > 16
          - delete_key(attributes, "http_route") where attributes["http_route"] != nil and not IsString(attributes["http_route"])
          - delete_key(attributes, "http_route") where IsString(attributes["http_route"]) and Len(attributes["http_route"]) > 200
          - delete_key(attributes, "request_body") where attributes["request_body"] != nil and not IsString(attributes["request_body"])
          - delete_key(attributes, "request_body") where IsString(attributes["request_body"]) and Len(attributes["request_body"]) > 8192
          - delete_key(attributes, "response_body") where attributes["response_body"] != nil and not IsString(attributes["response_body"])
          - delete_key(attributes, "response_body") where IsString(attributes["response_body"]) and Len(attributes["response_body"]) > 8192
          - delete_key(attributes, "request_body_omitted") where attributes["request_body_omitted"] != nil and not IsString(attributes["request_body_omitted"])
          - delete_key(attributes, "request_body_omitted") where IsString(attributes["request_body_omitted"]) and Len(attributes["request_body_omitted"]) > 32
          - delete_key(attributes, "response_body_omitted") where attributes["response_body_omitted"] != nil and not IsString(attributes["response_body_omitted"])
          - delete_key(attributes, "response_body_omitted") where IsString(attributes["response_body_omitted"]) and Len(attributes["response_body_omitted"]) > 32
          - delete_key(attributes, "error_type") where attributes["error_type"] != nil and not IsString(attributes["error_type"])
          - delete_key(attributes, "error_type") where IsString(attributes["error_type"]) and Len(attributes["error_type"]) > 120
          - delete_key(attributes, "error_code") where attributes["error_code"] != nil and not IsString(attributes["error_code"])
          - delete_key(attributes, "error_code") where IsString(attributes["error_code"]) and Len(attributes["error_code"]) > 80
          - delete_key(attributes, "outcome") where attributes["outcome"] != nil and not IsString(attributes["outcome"])
          - delete_key(attributes, "outcome") where IsString(attributes["outcome"]) and Len(attributes["outcome"]) > 32
          - delete_key(attributes, "stage") where attributes["stage"] != nil and not IsString(attributes["stage"])
          - delete_key(attributes, "stage") where IsString(attributes["stage"]) and Len(attributes["stage"]) > 80
          - delete_key(attributes, "trace_id") where attributes["trace_id"] != nil and not IsString(attributes["trace_id"])
          - delete_key(attributes, "trace_id") where IsString(attributes["trace_id"]) and Len(attributes["trace_id"]) > 32
          - delete_key(attributes, "span_id") where attributes["span_id"] != nil and not IsString(attributes["span_id"])
          - delete_key(attributes, "span_id") where IsString(attributes["span_id"]) and Len(attributes["span_id"]) > 16
          # 关联必须是成对、非零的小写十六进制；不接受截断值或把任意文本交给 TraceID 转换器。
          - delete_key(attributes, "trace_id") where IsString(attributes["trace_id"]) and (not IsMatch(attributes["trace_id"], "^[0-9a-f]{32}$") or attributes["trace_id"] == "00000000000000000000000000000000")
          - delete_key(attributes, "span_id") where IsString(attributes["span_id"]) and (not IsMatch(attributes["span_id"], "^[0-9a-f]{16}$") or attributes["span_id"] == "0000000000000000")
          - delete_key(attributes, "span_id") where attributes["trace_id"] == nil
          - delete_key(attributes, "trace_id") where attributes["span_id"] == nil
          # 已有完整 native 上下文优先；alias 最后与它统一，不能覆盖真实上下文或指向另一条链。
          - set(cache["partial_native"], true) where (trace_id == TraceID(0x00000000000000000000000000000000) and span_id != SpanID(0x0000000000000000)) or (trace_id != TraceID(0x00000000000000000000000000000000) and span_id == SpanID(0x0000000000000000))
          - set(trace_id, TraceID(0x00000000000000000000000000000000)) where cache["partial_native"] == true
          - set(span_id, SpanID(0x0000000000000000)) where cache["partial_native"] == true
          - set(trace_id, TraceID(attributes["trace_id"])) where attributes["trace_id"] != nil and trace_id == TraceID(0x00000000000000000000000000000000)
          - set(span_id, SpanID(attributes["span_id"])) where attributes["span_id"] != nil and span_id == SpanID(0x0000000000000000)
          - set(attributes["trace_id"], trace_id.string) where trace_id != TraceID(0x00000000000000000000000000000000) and span_id != SpanID(0x0000000000000000)
          - set(attributes["span_id"], span_id.string) where trace_id != TraceID(0x00000000000000000000000000000000) and span_id != SpanID(0x0000000000000000)
          - delete_key(attributes, "ai_operation") where attributes["ai_operation"] != nil and not IsString(attributes["ai_operation"])
          - delete_key(attributes, "ai_operation") where IsString(attributes["ai_operation"]) and Len(attributes["ai_operation"]) > 80
          - delete_key(attributes, "ai_provider") where attributes["ai_provider"] != nil and not IsString(attributes["ai_provider"])
          - delete_key(attributes, "ai_provider") where IsString(attributes["ai_provider"]) and Len(attributes["ai_provider"]) > 80
          - delete_key(attributes, "ai_model") where attributes["ai_model"] != nil and not IsString(attributes["ai_model"])
          - delete_key(attributes, "ai_model") where IsString(attributes["ai_model"]) and Len(attributes["ai_model"]) > 128
          - delete_key(attributes, "ai_response_model") where attributes["ai_response_model"] != nil and not IsString(attributes["ai_response_model"])
          - delete_key(attributes, "ai_response_model") where IsString(attributes["ai_response_model"]) and Len(attributes["ai_response_model"]) > 128
          - delete_key(attributes, "ai_prompt_key") where attributes["ai_prompt_key"] != nil and not IsString(attributes["ai_prompt_key"])
          - delete_key(attributes, "ai_prompt_key") where IsString(attributes["ai_prompt_key"]) and Len(attributes["ai_prompt_key"]) > 128
          - delete_key(attributes, "ai_prompt_version") where attributes["ai_prompt_version"] != nil and not IsString(attributes["ai_prompt_version"])
          - delete_key(attributes, "ai_prompt_version") where IsString(attributes["ai_prompt_version"]) and Len(attributes["ai_prompt_version"]) > 128
          - delete_key(attributes, "ai_prompt_source") where attributes["ai_prompt_source"] != nil and not IsString(attributes["ai_prompt_source"])
          - delete_key(attributes, "ai_prompt_source") where IsString(attributes["ai_prompt_source"]) and Len(attributes["ai_prompt_source"]) > 32
          - delete_key(attributes, "ai_reasoning_kind") where attributes["ai_reasoning_kind"] != nil and not IsString(attributes["ai_reasoning_kind"])
          - delete_key(attributes, "ai_reasoning_kind") where IsString(attributes["ai_reasoning_kind"]) and Len(attributes["ai_reasoning_kind"]) > 32
          - delete_key(attributes, "ai_finish_reason") where attributes["ai_finish_reason"] != nil and not IsString(attributes["ai_finish_reason"])
          - delete_key(attributes, "ai_finish_reason") where IsString(attributes["ai_finish_reason"]) and Len(attributes["ai_finish_reason"]) > 32
          - delete_key(attributes, "ai_input_summary") where attributes["ai_input_summary"] != nil and not IsString(attributes["ai_input_summary"])
          - delete_key(attributes, "ai_input_summary") where IsString(attributes["ai_input_summary"]) and Len(attributes["ai_input_summary"]) > 512
          - delete_key(attributes, "ai_output_summary") where attributes["ai_output_summary"] != nil and not IsString(attributes["ai_output_summary"])
          - delete_key(attributes, "ai_output_summary") where IsString(attributes["ai_output_summary"]) and Len(attributes["ai_output_summary"]) > 512
          - set(attributes["request_bytes"], Int(attributes["request_bytes"])) where IsDouble(attributes["request_bytes"]) and attributes["request_bytes"] >= 0 and attributes["request_bytes"] <= 9007199254740991 and attributes["request_bytes"] == Double(Int(attributes["request_bytes"]))
          - delete_key(attributes, "request_bytes") where attributes["request_bytes"] != nil and not IsInt(attributes["request_bytes"])
          - delete_key(attributes, "request_bytes") where IsInt(attributes["request_bytes"]) and (attributes["request_bytes"] < 0 or attributes["request_bytes"] > 9223372036854775807)
          - set(attributes["response_bytes"], Int(attributes["response_bytes"])) where IsDouble(attributes["response_bytes"]) and attributes["response_bytes"] >= 0 and attributes["response_bytes"] <= 9007199254740991 and attributes["response_bytes"] == Double(Int(attributes["response_bytes"]))
          - delete_key(attributes, "response_bytes") where attributes["response_bytes"] != nil and not IsInt(attributes["response_bytes"])
          - delete_key(attributes, "response_bytes") where IsInt(attributes["response_bytes"]) and (attributes["response_bytes"] < 0 or attributes["response_bytes"] > 9223372036854775807)
          - set(attributes["ai_input_tokens"], Int(attributes["ai_input_tokens"])) where IsDouble(attributes["ai_input_tokens"]) and attributes["ai_input_tokens"] >= 0 and attributes["ai_input_tokens"] <= 9007199254740991 and attributes["ai_input_tokens"] == Double(Int(attributes["ai_input_tokens"]))
          - delete_key(attributes, "ai_input_tokens") where attributes["ai_input_tokens"] != nil and not IsInt(attributes["ai_input_tokens"])
          - delete_key(attributes, "ai_input_tokens") where IsInt(attributes["ai_input_tokens"]) and (attributes["ai_input_tokens"] < 0 or attributes["ai_input_tokens"] > 9223372036854775807)
          - set(attributes["ai_output_tokens"], Int(attributes["ai_output_tokens"])) where IsDouble(attributes["ai_output_tokens"]) and attributes["ai_output_tokens"] >= 0 and attributes["ai_output_tokens"] <= 9007199254740991 and attributes["ai_output_tokens"] == Double(Int(attributes["ai_output_tokens"]))
          - delete_key(attributes, "ai_output_tokens") where attributes["ai_output_tokens"] != nil and not IsInt(attributes["ai_output_tokens"])
          - delete_key(attributes, "ai_output_tokens") where IsInt(attributes["ai_output_tokens"]) and (attributes["ai_output_tokens"] < 0 or attributes["ai_output_tokens"] > 9223372036854775807)
          - set(attributes["ai_reasoning_tokens"], Int(attributes["ai_reasoning_tokens"])) where IsDouble(attributes["ai_reasoning_tokens"]) and attributes["ai_reasoning_tokens"] >= 0 and attributes["ai_reasoning_tokens"] <= 9007199254740991 and attributes["ai_reasoning_tokens"] == Double(Int(attributes["ai_reasoning_tokens"]))
          - delete_key(attributes, "ai_reasoning_tokens") where attributes["ai_reasoning_tokens"] != nil and not IsInt(attributes["ai_reasoning_tokens"])
          - delete_key(attributes, "ai_reasoning_tokens") where IsInt(attributes["ai_reasoning_tokens"]) and (attributes["ai_reasoning_tokens"] < 0 or attributes["ai_reasoning_tokens"] > 9223372036854775807)
          - set(attributes["ai_input_characters"], Int(attributes["ai_input_characters"])) where IsDouble(attributes["ai_input_characters"]) and attributes["ai_input_characters"] >= 0 and attributes["ai_input_characters"] <= 9007199254740991 and attributes["ai_input_characters"] == Double(Int(attributes["ai_input_characters"]))
          - delete_key(attributes, "ai_input_characters") where attributes["ai_input_characters"] != nil and not IsInt(attributes["ai_input_characters"])
          - delete_key(attributes, "ai_input_characters") where IsInt(attributes["ai_input_characters"]) and (attributes["ai_input_characters"] < 0 or attributes["ai_input_characters"] > 9223372036854775807)
          - set(attributes["ai_output_characters"], Int(attributes["ai_output_characters"])) where IsDouble(attributes["ai_output_characters"]) and attributes["ai_output_characters"] >= 0 and attributes["ai_output_characters"] <= 9007199254740991 and attributes["ai_output_characters"] == Double(Int(attributes["ai_output_characters"]))
          - delete_key(attributes, "ai_output_characters") where attributes["ai_output_characters"] != nil and not IsInt(attributes["ai_output_characters"])
          - delete_key(attributes, "ai_output_characters") where IsInt(attributes["ai_output_characters"]) and (attributes["ai_output_characters"] < 0 or attributes["ai_output_characters"] > 9223372036854775807)
          - set(attributes["ai_message_count"], Int(attributes["ai_message_count"])) where IsDouble(attributes["ai_message_count"]) and attributes["ai_message_count"] >= 0 and attributes["ai_message_count"] <= 9007199254740991 and attributes["ai_message_count"] == Double(Int(attributes["ai_message_count"]))
          - delete_key(attributes, "ai_message_count") where attributes["ai_message_count"] != nil and not IsInt(attributes["ai_message_count"])
          - delete_key(attributes, "ai_message_count") where IsInt(attributes["ai_message_count"]) and (attributes["ai_message_count"] < 0 or attributes["ai_message_count"] > 9223372036854775807)
          - set(attributes["ai_document_count"], Int(attributes["ai_document_count"])) where IsDouble(attributes["ai_document_count"]) and attributes["ai_document_count"] >= 0 and attributes["ai_document_count"] <= 9007199254740991 and attributes["ai_document_count"] == Double(Int(attributes["ai_document_count"]))
          - delete_key(attributes, "ai_document_count") where attributes["ai_document_count"] != nil and not IsInt(attributes["ai_document_count"])
          - delete_key(attributes, "ai_document_count") where IsInt(attributes["ai_document_count"]) and (attributes["ai_document_count"] < 0 or attributes["ai_document_count"] > 9223372036854775807)
          - set(attributes["http_status"], Int(attributes["http_status"])) where IsDouble(attributes["http_status"]) and attributes["http_status"] >= 0 and attributes["http_status"] <= 9007199254740991 and attributes["http_status"] == Double(Int(attributes["http_status"]))
          - delete_key(attributes, "http_status") where attributes["http_status"] != nil and not IsInt(attributes["http_status"])
          - delete_key(attributes, "http_status") where IsInt(attributes["http_status"]) and (attributes["http_status"] < 100 or attributes["http_status"] > 599)
          - delete_key(attributes, "request_body_complete") where attributes["request_body_complete"] != nil and not IsBool(attributes["request_body_complete"])
          - delete_key(attributes, "response_body_complete") where attributes["response_body_complete"] != nil and not IsBool(attributes["response_body_complete"])
          - delete_key(attributes, "ai_usage_available") where attributes["ai_usage_available"] != nil and not IsBool(attributes["ai_usage_available"])
          - delete_key(attributes, "ai_reasoning_present") where attributes["ai_reasoning_present"] != nil and not IsBool(attributes["ai_reasoning_present"])
          - delete_key(attributes, "duration_ms") where attributes["duration_ms"] != nil and not IsInt(attributes["duration_ms"]) and not IsDouble(attributes["duration_ms"])
          - delete_key(attributes, "duration_ms") where attributes["duration_ms"] != nil and attributes["duration_ms"] < 0
          - delete_key(attributes, "summary") where attributes["event"] == "traffic.route.decision" and IsString(attributes["summary"]) and not IsMatch(attributes["summary"], "^traffic route (gateway|http_provider|dubbo_consumer|dubbo_provider) (stable|canary) (selected|rejected|unavailable|failed)$")
          - delete_key(attributes, "traffic_route_mode") where attributes["traffic_route_mode"] != nil and (not IsString(attributes["traffic_route_mode"]) or (attributes["traffic_route_mode"] != "stable" and attributes["traffic_route_mode"] != "canary") or attributes["event"] != "traffic.route.decision")
          - delete_key(attributes, "traffic_route_decision") where attributes["traffic_route_decision"] != nil and (not IsString(attributes["traffic_route_decision"]) or (attributes["traffic_route_decision"] != "selected" and attributes["traffic_route_decision"] != "rejected" and attributes["traffic_route_decision"] != "unavailable" and attributes["traffic_route_decision"] != "failed") or attributes["event"] != "traffic.route.decision")
          - delete_key(attributes, "traffic_route_hop") where attributes["traffic_route_hop"] != nil and (not IsString(attributes["traffic_route_hop"]) or (attributes["traffic_route_hop"] != "gateway" and attributes["traffic_route_hop"] != "http_provider" and attributes["traffic_route_hop"] != "dubbo_consumer" and attributes["traffic_route_hop"] != "dubbo_provider") or attributes["event"] != "traffic.route.decision")
  groupbyattrs/service:
    keys: ["service.name", "service.version", "deployment.environment.name"]
  batch:
    send_batch_size: 64
    send_batch_max_size: 128
exporters:
  otlp_http/central:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:FLEET_OTLP_TOKEN}"
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 256
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      # 默认 max_interval=30s 超过本机15s重试预算，显式收紧以通过原生校验。
      max_interval: 5s
      max_elapsed_time: 15s
service:
  extensions: [file_storage/offsets]
  pipelines:
    logs:
      receivers: [filelog/runtime]
      processors: [memory_limiter, transform/privacy, groupbyattrs/service, batch]
      exporters: [otlp_http/central]
  telemetry:
    logs:
      level: warn
