apiVersion: 1
datasources:
  - name: Prometheus
    uid: fleet-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: fleet-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
  - name: Elasticsearch
    uid: fleet-elasticsearch
    type: elasticsearch
    access: proxy
    url: $GITHUB_ES_URL
    editable: false
    jsonData:
      # 新运行日志索引与原请求审计分离；先核mapping/权限再接入。
      index: github_dev_runtime_log
      timeField: '@timestamp'
      httpHeaderName1: Authorization
      logMessageField: summary
      # Collector raw映射使用官方固定字段；事件名来自白名单属性event。
      logLevelField: SeverityText
      dataLinks:
        - field: trace_id
          url: '$${__value.raw}'
          datasourceUid: fleet-jaeger
          title: 查看链路
    secureJsonData:
      # 私有环境注入完整 Authorization；空值兼容未启用认证的 ES，不提交实际密钥。
      httpHeaderValue1: $GITHUB_ES_READ_AUTHORIZATION
