name: Observability configuration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ops/github-dev/observability/**
      - .github/workflows/observability-config.yml
  push:
    branches: [main]
    paths:
      - ops/github-dev/observability/**
      - .github/workflows/observability-config.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_ES_URL: http://127.0.0.1:9200
      GITHUB_ES_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Render and validate private-free fixtures
        working-directory: ops/github-dev/observability
        run: |
          python3 -m unittest discover -s . -p 'test_*.py' -v
          mkdir -m 700 .private
          for name in otlp_token actuator_token engine_token grafana_password; do
            printf 'synthetic-fixture-only' > ".private/$name"
            chmod 444 ".private/$name"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          import render
          names = render.SERVICES
          fixture = {'environment': 'github-dev', 'services': {name: f'127.0.0.1:{18000+i}' for i,name in enumerate(names)}, 'engine': '127.0.0.1:18091'}
          Path('.private/targets.json').write_text(json.dumps(fixture))
          PY
          python3 render.py .private/targets.json --output generated/prometheus.json
          docker compose config --quiet
      - name: Validate pinned component configurations
        working-directory: ops/github-dev/observability
        run: |
          docker compose run --rm --no-deps collector validate --config=/etc/otelcol/collector.yaml
          docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.json
          docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/alerts.yaml
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            -v "$PWD:/config:ro" --workdir /config --entrypoint promtool \
            prom/prometheus:v3.16.0 test rules dashboard-promql-tests.json
          docker compose run --rm --no-deps jaeger validate --config=/etc/jaeger/config.yaml
          docker run --rm --network none --tmpfs /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777 -e FLEET_LOG_DIR=/tmp -e FLEET_LOG_STATE_DIR=/tmp -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9 -e FLEET_OTLP_TOKEN=synthetic -v "$PWD:/config:ro" otel/opentelemetry-collector-contrib:0.164.0 validate --config=/config/collector-agent.yaml
      - name: Replay privacy and service grouping through pinned Collector
        working-directory: ops/github-dev/observability
        run: python3 verify_collector_native.py

  java-privacy:
    name: Actual Java agent egress privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Test pinned agent, API bridge and pre-Collector OTLP bytes
        run: ./gradlew -p ops/github-dev/observability/agent-extension clean test runtimeChecksums --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-privacy-egress-evidence
          path: |
            ops/github-dev/observability/agent-extension/build/test-results/test/
            ops/github-dev/observability/agent-extension/build/egress-evidence/
            ops/github-dev/observability/agent-extension/build/runtime/SHA256SUMS
