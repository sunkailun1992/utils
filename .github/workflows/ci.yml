# Utils CI guards the executable part of the AI coding standard.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      - name: Migration route contract tests
        run: python3 -m unittest discover -s ops/github-dev/tests -v

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
