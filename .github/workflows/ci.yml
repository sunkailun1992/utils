# Utils CI guards the executable part of the AI coding standard.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      # 容器集成测试（*IT）在 CI 里必须实际运行：打印计数，缺报告或被跳过（如 Docker 不可用）就判失败。
      - name: Container test summary
        run: |
          python3 - <<'PY'
          import glob, re, sys
          rows = []
          for path in sorted(glob.glob('build/test-results/test/TEST-*IT.xml')):
              counts = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(path, encoding='utf-8').read())
              rows.append((path.split('TEST-')[-1][:-4], *map(int, counts.groups())))
          for name, tests, skipped, failures, errors in rows:
              print(f'{name}: tests={tests} skipped={skipped} failures={failures} errors={errors}')
          if not rows or any(skipped for _, _, skipped, _, _ in rows):
              sys.exit('容器集成测试没有在 CI 里实际运行（缺少报告或被跳过）')
          PY

      # 测试失败时上传测试报告（含 Keycloak 容器日志），便于排查；只保留 7 天。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
          retention-days: 7

      - name: Migration route contract tests
        run: python3 -m unittest discover -s ops/github-dev/tests -v

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
